name: Yahoo API Diagnostic

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run Yahoo diagnostic
        run: npm run diagnose:yahoo > yahoo-diagnostic.json || true

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-diagnostic-${{ github.run_id }}
          path: yahoo-diagnostic.json
          if-no-files-found: warn